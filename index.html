<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Automations — Viaduct (prototype)</title>
<style>
/*
 * VDS Prototype Kit — vds.css
 *
 * DERIVED ARTIFACT — do not hand-edit. Regenerated by /figma-sync-vds (kit step)
 * from viaduct-ai/vehicle-profiles-ui master:
 *   - src/index.css            (MUI class overrides — pixel facts, colors)
 *   - src/BrandingWrapper.tsx  (MUI theme palette + component defaults)
 *   - .claude/vds-figma-keys.json (Figma variables + text styles)
 * Tailwind color references resolved against tailwindcss v4 theme.css (oklch → hex).
 *
 * Generated: 2026-07-15 (Figma cache synced 2026-07-15; index.css + BrandingWrapper.tsx fetched from master 2026-07-15)
 *
 * Usage: <link rel="stylesheet" href="vds.css"> — see reference.html for every
 * component/variant. Rule for prototypes: only vds-* classes and --vds-* custom
 * properties; never invent a color, radius, or size not defined here.
 */

@import url("https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@100..700&family=IBM+Plex+Mono:wght@100..700&family=IBM+Plex+Serif:wght@100..700&display=swap");

/* ---------------------------------------------------------------------------
 * 1. Tokens
 * ------------------------------------------------------------------------- */

:root {
  /* Fonts (src/index.css :root) */
  --vds-font-sans:
    "IBM Plex Sans", "Lato", ui-sans-serif, system-ui, sans-serif;
  --vds-font-mono:
    "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  --vds-font-serif: "IBM Plex Serif", ui-serif, Georgia, serif;

  /* Gray ramp — IBM Carbon override of Tailwind gray (src/index.css :root) */
  --vds-gray-50: #f4f4f4;
  --vds-gray-100: #e0e0e0;
  --vds-gray-200: #c6c6c6;
  --vds-gray-300: #a8a8a8;
  --vds-gray-400: #8d8d8d;
  --vds-gray-500: #6f6f6f;
  --vds-gray-600: #525252;
  --vds-gray-700: #393939;
  --vds-gray-800: #262626;
  --vds-gray-900: #161616;

  /* Slate ramp — Tailwind v4 defaults + custom slate-20 */
  --vds-slate-20: #f8fafb;
  --vds-slate-50: #f8fafc;
  --vds-slate-100: #f1f5f9;
  --vds-slate-200: #e2e8f0;
  --vds-slate-300: #cad5e2;
  --vds-slate-400: #90a1b9;

  /* Status colors (BrandingWrapper.tsx palette + Tailwind v4) */
  --vds-success: #06df73;
  --vds-success-light: #7af2a8;
  --vds-success-dark: #00c950;
  --vds-info: #50a2ff;
  --vds-info-light: #8ec6ff;
  --vds-info-dark: #2c7fff;
  --vds-error: #ff6467;
  --vds-error-light: #ffa2a3;
  --vds-error-dark: #f4303b;
  --vds-warning: #ffb900;
  --vds-warning-light: #ffd230;
  --vds-warning-dark: #fe9900;

  /* Semantic (Figma variables, DS v2 Current mode) */
  --vds-text-primary: #393939;
  --vds-text-secondary: #6f6f6f;
  --vds-text-placeholder: #8d8d8d;
  --vds-text-disabled: #c6c6c6;
  --vds-text-on-action: #ffffff;
  --vds-surface-default: #ffffff;
  --vds-surface-subtle: #f8fafb;
  --vds-surface-muted: #f1f5f9;
  --vds-surface-hover: #f1f5f9;
  --vds-surface-selected: #e2e8f0;
  --vds-surface-app-bar: #393939;
  --vds-border-default: #e0e0e0;
  --vds-border-input: var(--vds-slate-300);
  --vds-border-input-hover: #8d8d8d;
  --vds-border-input-focus: #393939;
  --vds-focus-ring: #60a5fa;
  --vds-surface-bad: #fecaca;
  --vds-surface-warn: #fde68a;
  --vds-surface-good: #b9f8cf;
  --vds-surface-info: #bfdbfe;
  --vds-surface-ai: #f3e8ff;

  /* Alert palettes (src/index.css, Tailwind v4 hexes) */
  --vds-alert-success-bg: #dcfce7; /* green-100 */
  --vds-alert-success-border: #b9f8cf; /* green-200 */
  --vds-alert-success-icon: #008236; /* green-700 */
  --vds-alert-error-bg: #ffe2e2; /* red-100 */
  --vds-alert-error-border: #ffc9c9; /* red-200 */
  --vds-alert-error-icon: #c10007; /* red-700 */
  --vds-alert-info-bg: #eff6ff; /* blue-50 */
  --vds-alert-info-border: #dbeafe; /* blue-100 */
  --vds-alert-info-icon: #1447e6; /* blue-700 */
  --vds-alert-warning-bg: #fef3c6; /* amber-100 */
  --vds-alert-warning-border: #fee685; /* amber-200 */
  --vds-alert-warning-icon: #bb4d00; /* amber-700 */

  /* Spacing (Figma Padding & Gap collection) */
  --vds-dialog-pad: 24px;
  --vds-dialog-gap: 16px;
  --vds-card-pad-h: 16px;
  --vds-card-pad-v: 12px;
  --vds-form-gap: 12px;
  --vds-label-gap: 4px;
  --vds-main-pad-h: 24px;
  --vds-main-pad-v: 16px;
  --vds-main-gap: 24px;
  --vds-button-gap: 8px;
  --vds-menu-open-w: 260px;
  --vds-menu-closed-w: 60px;

  /* Shadows (Tailwind v4 shadow-sm / shadow-md + custom shadow-bottom) */
  --vds-shadow-sm:
    0 1px 3px 0 rgb(0 0 0 / 0.1), 0 1px 2px -1px rgb(0 0 0 / 0.1);
  --vds-shadow-md:
    0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
  --vds-shadow-bottom: 0 4px 2px 0 rgb(0 0 0 / 0.1);

  /* Chart palette — the app's series colors (features/ui/charts/constants.ts
     COLOR_PALETTE, first 20 of 29). The Figma chart/1..20 variables alias a
     remote library and resolve to null in the cache, so the app code is the
     source of truth here. */
  --vds-chart-1: #50a2ff;
  --vds-chart-2: #fea5d5;
  --vds-chart-3: #d0c398;
  --vds-chart-4: #00d5be;
  --vds-chart-5: #e60049;
  --vds-chart-6: #e6d800;
  --vds-chart-7: #50e991;
  --vds-chart-8: #9b19f5;
  --vds-chart-9: #ffa300;
  --vds-chart-10: #dc0ab4;
  --vds-chart-11: #b3d4ff;
  --vds-chart-12: #00bfa0;
  --vds-chart-13: #ea5545;
  --vds-chart-14: #ef9b20;
  --vds-chart-15: #edbf33;
  --vds-chart-16: #ede15b;
  --vds-chart-17: #bdcf32;
  --vds-chart-18: #87bc45;
  --vds-chart-19: #27aeef;
  --vds-chart-20: #b33dc6;

  /* Component-specific values hardcoded in app code (not theme/Figma tokens) */
  --vds-brand-accent: #ff6161; /* sidebar logo top border (ViaductLogoSection) */
  --vds-switch-on: #05df72; /* tailwind green-400 — NOT the same as --vds-success */
  --vds-badge-bg: #51a2ff; /* tailwind blue-400 */
  --vds-stepper-active: #60a5fa; /* react-form-stepper styleConfig */
  --vds-stepper-inactive: #d8d8d8;
}

/* ---------------------------------------------------------------------------
 * 2. Base + typography
 * ------------------------------------------------------------------------- */

*,
*::before,
*::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: var(--vds-font-sans);
  font-size: 14px;
  line-height: 20px;
  color: var(--vds-text-primary);
  background: var(--vds-surface-muted); /* app page bg: slate-100 */
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

:is(button, input, select, textarea) {
  font-family: inherit;
}

:is(
  .vds-btn,
  .vds-icon-btn,
  .vds-input,
  .vds-select,
  .vds-textarea,
  .vds-tab,
  .vds-checkbox,
  .vds-radio,
  .vds-switch input
):focus-visible {
  outline: 2px solid var(--vds-focus-ring);
  outline-offset: 1px;
}

/* Headings (src/index.css h1–h6) */
h1,
.vds-h1 {
  font: 400 60px/1 var(--vds-font-sans);
  color: var(--vds-text-primary);
  margin: 0;
}
h2,
.vds-h2 {
  font: 400 36px/40px var(--vds-font-serif);
  color: var(--vds-text-primary);
  margin: 0;
}
h3,
.vds-h3 {
  font: 500 24px/32px var(--vds-font-sans);
  color: var(--vds-text-primary);
  margin: 0;
}
h4,
.vds-h4 {
  font: 700 16px/24px var(--vds-font-sans);
  color: var(--vds-text-primary);
  margin: 0;
}
h5,
.vds-h5 {
  font: 700 14px/20px var(--vds-font-sans);
  color: var(--vds-text-primary);
  margin: 0;
}
h6,
.vds-h6 {
  font: 700 12px/16px var(--vds-font-sans);
  color: var(--vds-text-primary);
  margin: 0;
}

/* Body + utility text styles (MuiTypography overrides + Figma text styles) */
.vds-b1 {
  font-size: 16px;
  line-height: 21px;
}
.vds-b2 {
  font-size: 14px;
  line-height: 20px;
}
.vds-b3 {
  font-size: 12px;
  line-height: 16px;
}
.vds-caption {
  font-size: 12px;
  line-height: 16px;
  color: var(--vds-gray-400);
}
.vds-overline {
  font: 500 12px/16px var(--vds-font-mono);
  letter-spacing: 0.6px;
  color: var(--vds-text-primary);
}
/* Page Title text style (Figma): IBM Plex Serif 36/47 */
.vds-page-title {
  font: 400 36px/47px var(--vds-font-serif);
  color: var(--vds-text-primary);
  margin: 0;
}

a {
  color: var(--vds-text-primary);
  text-decoration: none;
}

.vds-dotted-underline {
  cursor: help;
  text-decoration: underline dotted var(--vds-gray-300);
  text-decoration-thickness: 1px;
  text-underline-offset: 3px;
}

.vds-divider {
  border: none;
  border-top: 1px solid var(--vds-gray-100);
}

/* Breadcrumbs (.MuiBreadcrumbs-root): 12px mono medium uppercase, gray-700 */
.vds-breadcrumbs {
  display: flex;
  align-items: center;
  gap: 8px;
  font: 500 12px/16px var(--vds-font-mono);
  letter-spacing: 0.05em;
  text-transform: uppercase;
  color: var(--vds-text-primary);
}
.vds-breadcrumbs a {
  text-decoration: none;
}
.vds-breadcrumbs a:hover {
  text-decoration: underline;
}
.vds-breadcrumbs__sep {
  color: var(--vds-gray-400);
}

/* ---------------------------------------------------------------------------
 * 3. Button (.MuiButton-*)
 *    Base = contained secondary (the app default). Sizes: xs 24, sm 30, md 36 (default), lg 40.
 * ------------------------------------------------------------------------- */

.vds-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  height: 36px;
  padding: 0 16px;
  border-radius: 4px;
  font: 500 14px/20px var(--vds-font-sans);
  white-space: nowrap;
  cursor: pointer;
  text-decoration: none;
  background: var(--vds-surface-default);
  color: var(--vds-text-primary);
  border: 1px solid var(--vds-slate-300);
}
.vds-btn:hover {
  background: var(--vds-slate-20);
}
.vds-btn:disabled {
  color: var(--vds-gray-200);
  border-color: var(--vds-slate-200);
  cursor: default;
  background: var(--vds-surface-default);
}

.vds-btn--xs {
  height: 24px;
  padding: 0 12px;
}
.vds-btn--sm {
  height: 30px;
  padding: 0 12px;
}
.vds-btn--lg {
  height: 40px;
  padding: 0 16px;
}

/* With a leading icon → px 10; trailing icon → px 12 */
.vds-btn--start-icon {
  padding-left: 10px;
  padding-right: 10px;
}
.vds-btn--end-icon {
  padding-left: 12px;
  padding-right: 12px;
}
.vds-btn svg {
  width: 20px;
  height: 20px;
  flex: none;
}

.vds-btn--primary {
  background: var(--vds-gray-600);
  color: var(--vds-text-on-action);
  border-color: transparent;
}
.vds-btn--primary:hover {
  background: var(--vds-gray-700);
}
.vds-btn--primary:disabled {
  background: var(--vds-gray-400);
  color: var(--vds-gray-200);
  border-color: transparent;
}

.vds-btn--tertiary {
  background: var(--vds-slate-100);
  border-color: var(--vds-slate-300);
}
.vds-btn--tertiary:hover {
  background: var(--vds-slate-200);
}
.vds-btn--tertiary:disabled {
  background: var(--vds-slate-100);
  border-color: var(--vds-slate-200);
  color: var(--vds-gray-200);
}

.vds-btn--text {
  background: transparent;
  border-color: transparent;
}
.vds-btn--text:hover {
  background: var(--vds-slate-20);
  border-color: var(--vds-slate-200);
}
.vds-btn--text:disabled {
  background: transparent;
  border-color: transparent;
  color: var(--vds-gray-200);
}

/* Icon button (.MuiIconButton-*): square, radius 4px */
.vds-icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  padding: 12px;
  border: none;
  border-radius: 4px;
  background: transparent;
  color: var(--vds-text-primary);
  cursor: pointer;
}
.vds-icon-btn:hover {
  background: rgb(202 213 226 / 0.3);
} /* slate-300/30 */
.vds-icon-btn:active {
  background: rgb(202 213 226 / 0.4);
}
.vds-icon-btn:disabled {
  color: var(--vds-gray-200);
  background: transparent;
  cursor: default;
}
.vds-icon-btn--xs {
  width: 24px;
  height: 24px;
  padding: 6px;
}
.vds-icon-btn--sm {
  width: 30px;
  height: 30px;
  padding: 6px;
}
.vds-icon-btn--lg {
  width: 40px;
  height: 40px;
  padding: 12px;
}
.vds-icon-btn svg {
  width: 20px;
  height: 20px;
  flex: none;
}
.vds-icon-btn--xs svg {
  width: 18px;
  height: 18px;
}

/* Icon button color variants mirror the button palette (default is transparent) */
.vds-icon-btn--primary {
  background: var(--vds-gray-600);
  color: var(--vds-text-on-action);
}
.vds-icon-btn--primary:hover {
  background: var(--vds-gray-700);
}
.vds-icon-btn--primary:disabled {
  background: var(--vds-gray-400);
  color: var(--vds-gray-200);
}
.vds-icon-btn--secondary {
  background: var(--vds-surface-default);
  border: 1px solid var(--vds-slate-300);
}
.vds-icon-btn--secondary:hover {
  background: var(--vds-slate-20);
}
.vds-icon-btn--secondary:disabled {
  color: var(--vds-gray-200);
  border-color: var(--vds-slate-200);
  background: var(--vds-surface-default);
}
.vds-icon-btn--tertiary {
  background: var(--vds-slate-100);
  border: 1px solid var(--vds-slate-300);
}
.vds-icon-btn--tertiary:hover {
  background: var(--vds-slate-200);
}
.vds-icon-btn--tertiary:disabled {
  background: var(--vds-slate-100);
  border-color: var(--vds-slate-200);
  color: var(--vds-gray-200);
}

/* ---------------------------------------------------------------------------
 * 4. Inputs (.MuiOutlinedInput-*) — heights: sm 30, md 36 (default), lg 40
 * ------------------------------------------------------------------------- */

.vds-input,
.vds-select {
  height: 36px;
  padding: 0 12px;
  border-radius: 4px;
  border: 1px solid var(--vds-border-input);
  background: var(--vds-surface-default);
  font-size: 14px;
  color: var(--vds-text-primary);
  width: 100%;
}
.vds-input::placeholder {
  color: var(--vds-text-placeholder);
}
.vds-input:hover,
.vds-select:hover {
  border-color: var(--vds-border-input-hover);
}
.vds-input:focus,
.vds-select:focus {
  border-color: var(--vds-border-input-focus);
  outline: none;
}
.vds-input:disabled,
.vds-select:disabled,
.vds-textarea:disabled {
  background: var(--vds-slate-20);
  border-color: var(--vds-slate-200);
  color: var(--vds-gray-200);
}
.vds-input--sm,
.vds-select--sm {
  height: 30px;
}
.vds-input--lg,
.vds-select--lg {
  height: 40px;
}

.vds-select {
  appearance: none;
  padding-right: 32px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="%23393939" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>');
  background-repeat: no-repeat;
  background-position: right 6px center;
  cursor: pointer;
}

.vds-textarea {
  padding: 10px 12px;
  border-radius: 4px;
  border: 1px solid var(--vds-border-input);
  background: var(--vds-surface-default);
  font-size: 14px;
  line-height: 20px;
  color: var(--vds-text-primary);
  width: 100%;
  resize: vertical;
}
.vds-textarea:hover {
  border-color: var(--vds-border-input-hover);
}
.vds-textarea:focus {
  border-color: var(--vds-border-input-focus);
  outline: none;
}

/* Form layout: label 14px gray-500; label→control gap 4px; field→field gap 12px */
.vds-form {
  display: flex;
  flex-direction: column;
  gap: var(--vds-form-gap);
}
.vds-field {
  display: flex;
  flex-direction: column;
  gap: var(--vds-label-gap);
}
.vds-label {
  font-size: 14px;
  line-height: 20px;
  color: var(--vds-gray-500);
}
.vds-field--disabled .vds-label {
  color: var(--vds-gray-200);
}
.vds-helper-text {
  font-size: 12px;
  line-height: 16px;
  color: var(--vds-gray-500);
  margin: 3px 0 0;
}
.vds-helper-text--error {
  color: var(--vds-error-dark);
}

/* Checkbox + radio (.MuiCheckbox-* and .MuiRadio-*): gray-700, hover gray-500,
   disabled gray-300. Drawn with appearance:none + embedded SVG so the glyphs
   match MUI's rendering instead of varying by browser/OS. */
.vds-checkbox,
.vds-radio {
  appearance: none;
  width: 18px;
  height: 18px;
  margin: 0;
  border: 2px solid var(--vds-gray-700);
  background: transparent;
  cursor: pointer;
  flex: none;
}
.vds-checkbox {
  border-radius: 2px;
}
.vds-checkbox:checked {
  background-color: var(--vds-gray-700);
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="%23ffffff" d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>');
  background-size: 14px;
  background-position: center;
  background-repeat: no-repeat;
}
.vds-radio {
  border-radius: 50%;
}
.vds-radio:checked {
  background-image: radial-gradient(
    circle,
    var(--vds-gray-700) 0 4.5px,
    transparent 5px
  );
}
.vds-checkbox:disabled,
.vds-radio:disabled {
  border-color: var(--vds-gray-300);
  cursor: default;
}
.vds-checkbox:disabled:checked {
  background-color: var(--vds-gray-300);
}
.vds-radio:disabled:checked {
  background-image: radial-gradient(
    circle,
    var(--vds-gray-300) 0 4.5px,
    transparent 5px
  );
}
.vds-choice {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--vds-text-primary);
  cursor: pointer;
}
.vds-choice:hover :is(.vds-checkbox, .vds-radio):not(:disabled) {
  border-color: var(--vds-gray-500);
}
.vds-choice:hover .vds-checkbox:checked:not(:disabled) {
  background-color: var(--vds-gray-500);
}
.vds-choice:hover .vds-radio:checked:not(:disabled) {
  background-image: radial-gradient(
    circle,
    var(--vds-gray-500) 0 4.5px,
    transparent 5px
  );
}
.vds-choice:has(:disabled) {
  color: var(--vds-gray-300);
  cursor: default;
}

/* ---------------------------------------------------------------------------
 * 5. Chip (.MuiChip-*) — radius 2px; sm 22, md 30 (default), lg 40
 * ------------------------------------------------------------------------- */

.vds-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  height: 30px;
  padding: 0 10px;
  border-radius: 2px;
  font-size: 14px;
  background: var(--vds-slate-200);
  color: var(--vds-text-primary);
}
.vds-chip--sm {
  height: 22px;
}
.vds-chip--lg {
  height: 40px;
}
.vds-chip--success {
  background: var(--vds-alert-success-bg);
}
.vds-chip--warning {
  background: var(--vds-alert-warning-bg);
}
.vds-chip--error {
  background: var(--vds-alert-error-bg);
}

/* Deletable chip (.MuiChip-deletable): circled-x delete icon on the right */
.vds-chip__delete {
  display: inline-flex;
  border: none;
  padding: 0;
  background: none;
  color: var(--vds-gray-500);
  cursor: pointer;
}
.vds-chip__delete:hover {
  color: var(--vds-gray-700);
}
.vds-chip__delete svg {
  width: 16px;
  height: 16px;
}

/* ---------------------------------------------------------------------------
 * 6. Switch (.MuiSwitch-*) — md track 60×30 / thumb 22; sm 48×24 / thumb 18
 *    Markup: <label class="vds-switch"><input type="checkbox"><span class="vds-switch__track"></span></label>
 * ------------------------------------------------------------------------- */

.vds-switch {
  position: relative;
  display: inline-block;
  width: 60px;
  height: 30px;
  margin: 8px;
  flex: none;
}
.vds-switch input {
  position: absolute;
  opacity: 0;
  width: 100%;
  height: 100%;
  margin: 0;
  cursor: pointer;
}
.vds-switch__track {
  position: absolute;
  inset: 0;
  border-radius: 40px;
  background: var(--vds-gray-700);
  pointer-events: none;
}
.vds-switch__track::before,
.vds-switch__track::after {
  content: "";
  position: absolute;
  width: 18px;
  height: 18px;
  top: 50%;
  transform: translateY(-50%);
}
.vds-switch__track::before {
  left: 10px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" height="18" width="18" viewBox="0 0 24 24"><path fill="%23393939" d="M21,7L9,19L3.5,13.5L4.91,12.09L9,16.17L19.59,5.59L21,7Z"/></svg>');
}
.vds-switch__track::after {
  right: 10px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" height="18" width="18" viewBox="0 0 24 24"><path fill="%23ffffff" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>');
}
.vds-switch__thumb {
  position: absolute;
  top: 4px;
  left: 4px;
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--vds-surface-default);
  box-shadow: 0 1px 2px rgb(0 0 0 / 0.2);
  z-index: 1;
}
.vds-switch input:checked + .vds-switch__track {
  background: var(--vds-switch-on);
}
.vds-switch input:checked + .vds-switch__track .vds-switch__thumb {
  transform: translateX(30px);
}
.vds-switch input:disabled + .vds-switch__track {
  background: var(--vds-gray-100);
}
.vds-switch input:disabled + .vds-switch__track .vds-switch__thumb {
  background: var(--vds-gray-50);
}

.vds-switch--sm {
  width: 48px;
  height: 24px;
}
.vds-switch--sm .vds-switch__track::before,
.vds-switch--sm .vds-switch__track::after {
  width: 14px;
  height: 14px;
  background-size: 14px;
}
.vds-switch--sm .vds-switch__track::before {
  left: 8px;
}
.vds-switch--sm .vds-switch__track::after {
  right: 8px;
}
.vds-switch--sm .vds-switch__thumb {
  top: 3px;
  left: 3px;
  width: 18px;
  height: 18px;
}
.vds-switch--sm input:checked + .vds-switch__track .vds-switch__thumb {
  transform: translateX(24px);
}

/* ---------------------------------------------------------------------------
 * 7. Accordion (.MuiAccordion-*) — border slate-300, radius 8; summary sm 30 / md 36 / lg 40
 *    Markup: <details class="vds-accordion"><summary>…</summary><div class="vds-accordion__details">…</div></details>
 * ------------------------------------------------------------------------- */

.vds-accordion {
  border: 1px solid var(--vds-slate-300);
  border-radius: 8px;
  background: var(--vds-surface-default);
}
.vds-accordion:hover {
  border-color: var(--vds-gray-400);
}
.vds-accordion > summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 36px;
  padding: 0 10px;
  font-size: 14px;
  cursor: pointer;
  list-style: none;
}
.vds-accordion > summary::-webkit-details-marker {
  display: none;
}
.vds-accordion > summary::after {
  content: "";
  width: 20px;
  height: 20px;
  background-image: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24"><path fill="%23393939" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>');
  transition: transform 0.15s;
}
.vds-accordion[open] > summary::after {
  transform: rotate(180deg);
}
.vds-accordion--sm > summary {
  height: 30px;
}
.vds-accordion--lg > summary {
  height: 40px;
}
.vds-accordion__details {
  padding: 10px;
  font-size: 14px;
}
.vds-accordion--filled {
  background: var(--vds-slate-50);
}
.vds-accordion--filled .vds-accordion__details {
  border-top: 1px solid var(--vds-slate-300);
}
.vds-accordion--mixed .vds-accordion__details {
  background: var(--vds-slate-50);
  border-top: 1px solid var(--vds-slate-300);
  border-radius: 0 0 8px 8px;
}

/* ---------------------------------------------------------------------------
 * 8. Alert (.MuiAlert-*) — radius 8, padding 10px (16px left), shadow-sm
 * ------------------------------------------------------------------------- */

.vds-alert {
  display: flex;
  align-items: flex-start;
  gap: 12px;
  padding: 10px 10px 10px 16px;
  border-radius: 8px;
  border: 1px solid;
  font-size: 14px;
  color: var(--vds-text-primary);
  box-shadow: var(--vds-shadow-sm);
}
.vds-alert__icon {
  flex: none;
  width: 20px;
  height: 20px;
  margin-top: 1px;
}
.vds-alert__title {
  font-size: 16px;
  line-height: 24px;
  font-weight: 700;
  margin: 0 0 2px;
}
.vds-alert--success {
  background: var(--vds-alert-success-bg);
  border-color: var(--vds-alert-success-border);
}
.vds-alert--success .vds-alert__icon {
  color: var(--vds-alert-success-icon);
}
.vds-alert--error {
  background: var(--vds-alert-error-bg);
  border-color: var(--vds-alert-error-border);
}
.vds-alert--error .vds-alert__icon {
  color: var(--vds-alert-error-icon);
}
.vds-alert--info {
  background: var(--vds-alert-info-bg);
  border-color: var(--vds-alert-info-border);
}
.vds-alert--info .vds-alert__icon {
  color: var(--vds-alert-info-icon);
}
.vds-alert--warning {
  background: var(--vds-alert-warning-bg);
  border-color: var(--vds-alert-warning-border);
}
.vds-alert--warning .vds-alert__icon {
  color: var(--vds-alert-warning-icon);
}

/* ---------------------------------------------------------------------------
 * 9. Card (.MuiCard-root) — border gray-100, radius 8, p16
 * ------------------------------------------------------------------------- */

.vds-card {
  border: 1px solid var(--vds-gray-100);
  border-radius: 8px;
  background: var(--vds-surface-default);
  padding: 16px;
  color: var(--vds-text-primary);
}

/* ---------------------------------------------------------------------------
 * 10. Dialog (.MuiDialog-*) — radius 8, border gray-100, maxWidth md (900px)
 *     Title: p16, 16px bold, bg slate-100, border-b gray-100. Content/actions: p16.
 * ------------------------------------------------------------------------- */

.vds-dialog {
  width: calc(100% - 64px);
  max-width: 900px;
  border: 1px solid var(--vds-gray-100);
  border-radius: 8px;
  background: var(--vds-surface-default);
  padding: 0;
  color: var(--vds-text-primary);
  box-shadow:
    0 11px 15px -7px rgb(0 0 0 / 0.2),
    0 24px 38px 3px rgb(0 0 0 / 0.14);
}
.vds-dialog::backdrop {
  background: rgb(0 0 0 / 0.5);
}
.vds-dialog__title {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 16px;
  font-size: 16px;
  font-weight: 700;
  background: var(--vds-slate-100);
  border-bottom: 1px solid var(--vds-gray-100);
}
.vds-dialog__content {
  padding: 16px;
  font-size: 16px;
}
.vds-dialog__actions {
  display: flex;
  justify-content: flex-end;
  gap: var(--vds-button-gap);
  padding: 16px;
}

/* ---------------------------------------------------------------------------
 * 11. Tabs (.MuiTabs-* / .MuiTab-*) — container border-b gray-100;
 *     tab 24px/500 px24 py12 gray-400; selected gray-700 + 4px gray-700 indicator.
 *     Small: 16px/400 px20 py8.
 * ------------------------------------------------------------------------- */

.vds-tabs {
  display: flex;
  align-items: center;
  border-bottom: 1px solid var(--vds-gray-100);
  margin-bottom: 8px;
}
.vds-tab {
  position: relative;
  padding: 12px 24px;
  font: 500 24px/32px var(--vds-font-sans);
  color: var(--vds-gray-400);
  background: none;
  border: none;
  cursor: pointer;
}
.vds-tab:hover,
.vds-tab--selected {
  color: var(--vds-gray-700);
}
.vds-tab--selected::after {
  content: "";
  position: absolute;
  left: 0;
  right: 0;
  bottom: -1px;
  height: 4px;
  background: var(--vds-gray-700);
}
.vds-tabs--sm .vds-tab {
  padding: 8px 20px;
  font: 400 16px/24px var(--vds-font-sans);
}

/* ---------------------------------------------------------------------------
 * 12. Table (.MuiDataGrid-* / MaterialTable) — container border gray-100 radius 8;
 *     toolbar 50px white; header bg slate-50 h50 text 12px with hover-revealed
 *     sort arrow + kebab menu (MUI DataGrid defaults); rows white h46 hover
 *     slate-100 selected slate-200; cells border-b gray-100; footer bg slate-200 h50.
 * ------------------------------------------------------------------------- */

.vds-table-container {
  border: 1px solid var(--vds-gray-100);
  border-radius: 8px;
  overflow: hidden;
  background: var(--vds-surface-default);
}

/* CustomTableToolbar: 50px white bar above the grid — count (h5) left, actions right */
.vds-table-toolbar {
  height: 50px;
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 0 8px;
  background: var(--vds-surface-default);
  border-bottom: 1px solid var(--vds-gray-100);
}
.vds-table-toolbar__count {
  font: 700 14px/20px var(--vds-font-sans);
  margin-left: 6px;
}
.vds-table-toolbar__actions {
  margin-left: auto;
  display: flex;
  gap: 8px;
}

.vds-table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
.vds-table thead th {
  height: 50px;
  padding: 0 10px;
  background: var(--vds-slate-50);
  font-size: 12px;
  line-height: 1.2;
  font-weight: 500;
  text-align: center;
  color: var(--vds-text-primary);
}
/* Sortable header: arrow visible when sorted, faded in on hover otherwise (DataGrid default) */
.vds-th--sortable {
  cursor: pointer;
}
.vds-th--sortable .vds-sort-icon {
  width: 16px;
  height: 16px;
  vertical-align: -3px;
  margin-left: 2px;
  color: var(--vds-gray-500);
  opacity: 0;
  transition: opacity 0.15s;
}
.vds-th--sortable:hover .vds-sort-icon {
  opacity: 0.5;
}
.vds-th--sorted .vds-sort-icon {
  opacity: 1;
}
.vds-th--sorted-desc .vds-sort-icon {
  transform: rotate(180deg);
}
.vds-th__menu {
  float: right;
  width: 20px;
  height: 20px;
  border: none;
  padding: 2px;
  background: none;
  color: var(--vds-gray-500);
  cursor: pointer;
  opacity: 0;
  transition: opacity 0.15s;
}
.vds-table thead th:hover .vds-th__menu {
  opacity: 1;
}
.vds-th__menu svg {
  width: 16px;
  height: 16px;
}

.vds-table tbody td {
  height: 46px;
  padding: 0 10px;
  background: var(--vds-surface-default);
  border-bottom: 1px solid var(--vds-gray-100);
}
.vds-table tbody tr:last-child td {
  border-bottom: none;
}
.vds-table tbody tr:hover td {
  background: var(--vds-slate-100);
}
.vds-table tbody tr.vds-table__row--selected td {
  background: var(--vds-slate-200);
}

/* Footer with TablePagination-style content, right-aligned */
.vds-table tfoot td {
  height: 50px;
  padding: 0 10px;
  background: var(--vds-slate-200);
  font-size: 12px;
}
.vds-table-pagination {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 20px;
  padding-right: 10px;
}
.vds-table-pagination .vds-icon-btn {
  width: 30px;
  height: 30px;
  padding: 6px;
}

/* Applied-filters row (FiltersOverview): small deletable chips + Clear all button */
.vds-filters-row {
  display: inline-flex;
  align-items: baseline;
  flex-wrap: wrap;
  column-gap: 12px;
  row-gap: 4px;
}

/* ---------------------------------------------------------------------------
 * 13. Menu / Popover (.MuiPopover-* / .MuiMenuItem-*) — white panel, shadow-md,
 *     radius 8, border gray-100, 4px offset; items 14px, hover slate-100,
 *     selected slate-200. Same panel styles serve Select/Autocomplete dropdowns.
 * ------------------------------------------------------------------------- */

.vds-menu {
  min-width: 160px;
  padding: 8px 0;
  background: var(--vds-surface-default);
  border: 1px solid var(--vds-gray-100);
  border-radius: 8px;
  box-shadow: var(--vds-shadow-md);
  margin-top: 4px;
}
.vds-menu-item {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px 16px;
  font-size: 14px;
  color: var(--vds-text-primary);
  cursor: pointer;
  white-space: nowrap;
}
.vds-menu-item:hover {
  background: var(--vds-slate-100);
}
.vds-menu-item--selected,
.vds-menu-item--selected:hover {
  background: var(--vds-slate-200);
}
.vds-menu-divider {
  border: none;
  border-top: 1px solid var(--vds-gray-100);
  margin: 8px 0;
}

/* ---------------------------------------------------------------------------
 * 13b. Tooltip + Badge + Toast
 * ------------------------------------------------------------------------- */

.vds-tooltip {
  position: relative;
  display: inline-block;
  padding: 4px 8px;
  background: var(--vds-surface-default);
  color: var(--vds-text-primary);
  font-size: 14px;
  border: 1px solid var(--vds-gray-100);
  border-radius: 8px;
  box-shadow: var(--vds-shadow-md);
}
/* App tooltips always have an arrow (MuiTooltip arrow: true). Default: arrow on
   the top edge (tooltip sits below its target). */
.vds-tooltip--arrow::before {
  content: "";
  position: absolute;
  top: -5px;
  left: 50%;
  width: 8px;
  height: 8px;
  transform: translateX(-50%) rotate(45deg);
  background: var(--vds-surface-default);
  border-top: 1px solid var(--vds-gray-100);
  border-left: 1px solid var(--vds-gray-100);
}

/* Toast (features/ui/Toast): a standard vds-alert floated top-right */
.vds-toast {
  position: fixed;
  top: 24px;
  right: 24px;
  z-index: 100;
  max-width: 400px;
}

/* Stepper (features/ui/Stepper): 21px circles — inactive #d8d8d8 with 3px white
   ring, active blue #60a5fa (blue-100 ring), completed blue at 50%; 10px labels */
.vds-stepper {
  display: flex;
  align-items: flex-start;
  padding: 8px 12px;
}
.vds-step {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.vds-step__circle {
  width: 21px;
  height: 21px;
  border-radius: 50%;
  background: var(--vds-stepper-inactive);
  border: 3px solid var(--vds-surface-default);
  box-sizing: content-box;
}
.vds-step--active .vds-step__circle {
  background: var(--vds-stepper-active);
  border-color: var(--vds-alert-info-border);
}
.vds-step--completed .vds-step__circle {
  background: color-mix(in srgb, var(--vds-stepper-active) 50%, transparent);
}
.vds-step__label {
  font-size: 10px;
  color: var(--vds-text-primary);
}
.vds-step-connector {
  flex: 1;
  height: 1px;
  background: var(--vds-stepper-inactive);
  margin-top: 13px;
  min-width: 24px;
}

.vds-badge-anchor {
  position: relative;
  display: inline-flex;
}
.vds-badge {
  position: absolute;
  top: 2px;
  right: 2px;
  transform: translate(50%, -50%);
  min-width: 16px;
  height: 16px;
  padding: 0 4px;
  border-radius: 8px;
  background: var(--vds-badge-bg);
  color: var(--vds-text-on-action);
  font-size: 12px;
  line-height: 16px;
  text-align: center;
}

/* ---------------------------------------------------------------------------
 * 14. App shell (features/layout/AppLayout + SidebarNav + TopHeader)
 *     Row layout at 100dvh: white sidebar 240px (collapsed 64px) | main column =
 *     sticky 60px gray-700 top header + scrollable content (pt 20 / px 32 / pb 40,
 *     from CONTENT_CLASSES_WITH_TOP_HEADER "pb-10 px-8 pt-5").
 * ------------------------------------------------------------------------- */

.vds-page {
  display: flex;
  height: 100dvh;
  overflow: hidden;
  background: var(--vds-surface-muted);
}

.vds-sidebar {
  width: 240px; /* SIDEBAR_EXPANDED_WIDTH_CLASS w-[15rem] */
  flex: none;
  background: var(--vds-surface-default);
  box-shadow: var(--vds-shadow-sm);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
.vds-sidebar--closed {
  width: 64px;
} /* SIDEBAR_COLLAPSED_WIDTH_CLASS w-[4rem] */

/* Logo section: 60px, 8px coral top border, chevron + 100px-wide Viaduct logo
   (ViaductLogoSection: outer px-4 + inner px-2 = 24px inset; chevron↔logo
   space-x-7.5 = 30px) */
.vds-logo-section {
  height: 60px;
  flex: none;
  display: flex;
  align-items: center;
  gap: 30px;
  padding: 0 24px;
  border-top: 8px solid var(--vds-brand-accent);
  border-bottom: 1px solid var(--vds-gray-100);
  cursor: pointer;
}
.vds-logo-section:hover {
  background: var(--vds-slate-100);
}
.vds-logo-section svg {
  flex: none;
}
.vds-logo-section .vds-logo-collapse {
  color: var(--vds-gray-300);
  width: 20px;
  height: 20px;
}
.vds-logo-section:hover .vds-logo-collapse {
  color: var(--vds-gray-700);
}

.vds-nav {
  list-style: none;
  margin: 10px 0 0;
  padding: 0;
}
.vds-nav > li {
  padding: 2px 8px;
}
.vds-nav-item {
  display: flex;
  align-items: center;
  gap: 24px; /* space-x-6 between icon and label */
  height: 40px;
  border-radius: 4px;
  font-size: 14px;
  color: var(--vds-text-primary);
  text-decoration: none;
  cursor: pointer;
}
.vds-nav-item:hover {
  background: var(--vds-slate-50);
}
.vds-nav-item--selected,
.vds-nav-item--selected:hover {
  background: var(--vds-slate-200);
}
.vds-nav-item svg {
  width: 24px;
  height: 24px;
  margin-left: 16px;
  flex: none;
}

/* Collapsible group header: white pill, uppercase mono title */
.vds-nav-group {
  display: flex;
  align-items: center;
  justify-content: space-between;
  height: 30px;
  padding: 0 8px 0 16px;
  background: var(--vds-surface-default);
  border: 1px solid var(--vds-slate-200);
  border-radius: 8px;
  cursor: pointer;
}
.vds-nav-group:hover {
  background: var(--vds-slate-50);
}
.vds-nav-group__title {
  font: 500 12px/16px var(--vds-font-mono);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--vds-gray-400);
}
.vds-nav-group svg {
  width: 20px;
  height: 20px;
  color: var(--vds-gray-700);
}

.vds-sidebar-footer {
  margin-top: auto;
  margin-bottom: 12px;
  padding-top: 2px;
  border-top: 1px solid var(--vds-gray-200);
}

/* Main column right of the sidebar */
.vds-shell-main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}
.vds-top-header {
  height: 60px;
  flex: none;
  position: sticky;
  top: 0;
  z-index: 10;
  background: var(--vds-gray-700);
  color: var(--vds-text-on-action);
  display: flex;
  align-items: center;
  padding: 8px 32px;
}
.vds-top-header__title {
  flex: 1;
  min-width: 0;
  font-size: 16px;
  line-height: 24px;
  text-transform: capitalize;
}
.vds-top-header__center {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: center;
  padding: 0 16px;
}
.vds-top-header__actions {
  flex: 1;
  min-width: 0;
  display: flex;
  justify-content: flex-end;
  align-items: center;
  gap: 8px;
}

/* GlobalSearchAction: a 400px secondary button (not an input) — search icon +
   gray-500 placeholder left, bordered ⌘+K hint right. Opens the search dialog. */
.vds-search-trigger {
  justify-content: flex-start;
  width: 400px;
  max-width: 100%;
}
.vds-search-trigger__label {
  color: var(--vds-gray-500);
  font-weight: 500;
  text-transform: capitalize;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-right: 4px;
}
.vds-search-trigger__kbd {
  margin-left: auto;
  display: inline-flex;
  align-items: center;
  border: 1px solid var(--vds-gray-300);
  border-radius: 4px;
  padding: 0 4px;
  font-size: 12px;
  font-family: var(--vds-font-sans);
}

/* UserMenu trigger: 30px transparent icon button with gray-500 border,
   person icon gray-200 → gray-100 on hover (sits on the dark header) */
.vds-user-btn {
  border: 1px solid var(--vds-gray-500);
  color: var(--vds-gray-200);
}
.vds-user-btn:hover {
  color: var(--vds-gray-100);
}

.vds-content {
  flex: 1;
  min-width: 0;
  overflow: auto;
  padding: 20px 32px 40px;
}

/* PageHeaderWrapper: title row with 10px bottom padding+margin and gray-100 divider */
.vds-page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding-bottom: 10px;
  margin-bottom: 10px;
  border-bottom: 1px solid var(--vds-gray-100);
}
.vds-page-header__subtitle {
  color: var(--vds-gray-400);
  max-width: 700px;
}

/* Layout-only additions on top of vds.css. No colors/radii/shadows/control
   sizes here — those all come from vds-* classes and --vds-* tokens. */

html,
body {
  margin: 0;
  height: 100%;
}

.row-link {
  cursor: pointer;
}

.cell-name {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.menu-anchor {
  position: relative;
  display: inline-block;
}

.menu-anchor .vds-menu {
  position: absolute;
  right: 0;
  top: 100%;
  margin-top: 4px;
  z-index: 5;
}

.page-title-input {
  border: 1px solid transparent;
  background: transparent;
  border-radius: 4px;
  padding: 2px 8px;
  margin: -3px -9px;
  outline: none;
  flex: 1;
  min-width: 0;
}
.page-title-input:hover {
  background: var(--vds-surface-default);
  border-color: var(--vds-border-input-hover);
}
.page-title-input:focus {
  background: var(--vds-surface-default);
  border-color: var(--vds-border-input-focus);
}

.step-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.step-card {
  padding: 0;
}

.step-card__header {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 12px 16px;
  border-bottom: 1px solid var(--vds-gray-100);
}

.step-card__drag-handle {
  cursor: grab;
  color: var(--vds-gray-400);
  display: flex;
  align-items: center;
  flex: none;
}
.step-card__drag-handle:active {
  cursor: grabbing;
}

.step-card__index {
  flex: none;
}

.step-card__name-field {
  flex: 1;
  min-width: 0;
}

.step-card__body {
  display: flex;
  flex-direction: column;
  gap: 20px;
  padding: 16px;
}

.step-card.is-dragging {
  opacity: 0.4;
}

.step-card.is-drop-target {
  outline: 2px solid var(--vds-info);
  outline-offset: 2px;
}

.trigger-choice-row {
  display: flex;
  gap: 24px;
}

.trigger-fields-row {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
}
.trigger-fields-row[hidden] {
  display: none;
}

.trigger-fields-row .vds-field {
  min-width: 180px;
}

.trigger-fields-row .vds-field--narrow {
  min-width: 100px;
  max-width: 140px;
}

.action-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.action-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.action-row .vds-field {
  flex: none;
}

.action-row__drag-handle {
  cursor: grab;
  color: var(--vds-gray-400);
  display: flex;
  align-items: center;
  flex: none;
}
.action-row__drag-handle:active {
  cursor: grabbing;
}

.action-row.is-dragging {
  opacity: 0.4;
}

.action-row.is-drop-target {
  outline: 2px solid var(--vds-info);
  outline-offset: 2px;
}

.action-row__type-field {
  width: 140px;
}

.action-row__ref-field {
  width: 260px;
}

.action-row__notification-field {
  width: 260px;
}

.action-row__ref-field[hidden],
.action-row__notification-field[hidden] {
  display: none;
}

.section-title-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.editor-footer {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 24px;
}

.empty-steps {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 12px;
  padding: 40px 0;
}
</style>

function loadAutomations() {
  const raw = localStorage.getItem(STORAGE_KEY);
  if (!raw) {
    const seeded = seedAutomations();
    saveAutomations(seeded);
    return seeded;
  }
  try {
    return JSON.parse(raw);
  } catch {
    const seeded = seedAutomations();
    saveAutomations(seeded);
    return seeded;
  }
}

function saveAutomations(automations) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(automations));
}

function getAutomation(id) {
  return loadAutomations().find((a) => a.id === id) || null;
}

function upsertAutomation(automation) {
  const automations = loadAutomations();
  const idx = automations.findIndex((a) => a.id === automation.id);
  if (idx === -1) {
    automations.push(automation);
  } else {
    automations[idx] = automation;
  }
  saveAutomations(automations);
}

function deleteAutomation(id) {
  saveAutomations(loadAutomations().filter((a) => a.id !== id));
}

function duplicateAutomation(id) {
  const source = getAutomation(id);
  if (!source) return null;
  const copy = JSON.parse(JSON.stringify(source));
  copy.id = "auto_" + Date.now();
  copy.name = source.name + " (copy)";
  copy.createdAt = new Date().toISOString().slice(0, 10);
  copy.createdBy = "Jeff Kroll";
  copy.lastRunAt = null;
  copy.lastRunBy = null;
  const automations = loadAutomations();
  automations.push(copy);
  saveAutomations(automations);
  return copy;
}

function newStepTemplate(seq) {
  return {
    id: "step_new_" + Date.now() + "_" + seq,
    name: "",
    trigger: { type: "event", table: TABLES[0], event: "new_row", intervalValue: 1, intervalUnit: "minutes" },
    actions: [{ id: "act_new_" + Date.now() + "_" + seq, type: "directive", refName: "" }],
  };
}

function newActionTemplate() {
  return { id: "act_new_" + Date.now(), type: "directive", refName: "" };
}

const TRIGGER_TYPE_LABELS = {
  event: "Table event",
  schedule: "Schedule",
  manual: "Manual invocation",
  after_previous: "After previous step",
};

function triggerTypeLabel(type) {
  return TRIGGER_TYPE_LABELS[type] || type;
}

function formatDate(iso) {
  if (!iso) return "—";
  const [y, m, d] = iso.split("-");
  const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  return `${months[parseInt(m, 10) - 1]} ${parseInt(d, 10)}, ${y}`;
}

// Single-file build: list view + editor view live in one document and are
// toggled by hiding/showing their containers, instead of separate HTML pages.

const viewList = document.getElementById("view-list");
const viewEditor = document.getElementById("view-editor");

function showListView() {
  closeOpenMenu();
  viewEditor.hidden = true;
  viewList.hidden = false;
  renderList();
}

function showEditorView(id, isNewFlag) {
  const ok = initEditor(id, isNewFlag);
  if (!ok) return;
  viewList.hidden = true;
  viewEditor.hidden = false;
}

function renderList() {
  const automations = loadAutomations().slice().sort((a, b) => (a.createdAt < b.createdAt ? 1 : -1));
  document.getElementById("automations-count").textContent =
    automations.length + (automations.length === 1 ? " Automation" : " Automations");

  const tbody = document.getElementById("automations-tbody");
  tbody.innerHTML = "";

  automations.forEach((automation) => {
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td class="row-link" data-open="${automation.id}">
        <div class="cell-name">
          <span class="vds-b2">${escapeHtml(automation.name)}</span>
        </div>
      </td>
      <td style="text-align:center">${automation.steps.length}</td>
      <td>${automation.steps[0] ? escapeHtml(triggerTypeLabel(automation.steps[0].trigger.type)) : "—"}</td>
      <td>${formatDate(automation.lastRunAt)}</td>
      <td>${automation.lastRunBy ? escapeHtml(automation.lastRunBy) : "—"}</td>
      <td>${formatDate(automation.createdAt)}</td>
      <td>${escapeHtml(automation.createdBy)}</td>
      <td>
        <div class="menu-anchor">
          <button class="vds-icon-btn vds-icon-btn--sm" data-kebab="${automation.id}" title="Row actions">
            <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2m0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2m0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2"/></svg>
          </button>
        </div>
      </td>
    `;
    tbody.appendChild(tr);
  });

  tbody.querySelectorAll("[data-open]").forEach((el) => {
    el.addEventListener("click", () => {
      showEditorView(el.dataset.open, false);
    });
  });

  tbody.querySelectorAll("[data-kebab]").forEach((btn) => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      openRowMenu(btn, btn.dataset.kebab);
    });
  });
}

function closeOpenMenu() {
  const existing = document.querySelector(".vds-menu");
  if (existing) existing.remove();
}

function openRowMenu(anchorBtn, automationId) {
  const alreadyOpenForThis = anchorBtn.parentElement.querySelector(".vds-menu");
  closeOpenMenu();
  if (alreadyOpenForThis) return;

  const menu = document.createElement("div");
  menu.className = "vds-menu";
  menu.style.width = "160px";
  menu.innerHTML = `
    <div class="vds-menu-item" data-action="edit">Edit</div>
    <div class="vds-menu-item" data-action="duplicate">Duplicate</div>
    <hr class="vds-menu-divider" />
    <div class="vds-menu-item" data-action="delete">Delete</div>
  `;
  anchorBtn.parentElement.appendChild(menu);

  menu.querySelector('[data-action="edit"]').addEventListener("click", () => {
    showEditorView(automationId, false);
  });
  menu.querySelector('[data-action="duplicate"]').addEventListener("click", () => {
    duplicateAutomation(automationId);
    closeOpenMenu();
    renderList();
  });
  menu.querySelector('[data-action="delete"]').addEventListener("click", () => {
    const automation = getAutomation(automationId);
    if (automation && window.confirm(`Delete "${automation.name}"? This can't be undone.`)) {
      deleteAutomation(automationId);
    }
    closeOpenMenu();
    renderList();
  });
}

function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

document.addEventListener("click", closeOpenMenu);

document.getElementById("new-automation-btn").addEventListener("click", () => {
  showEditorView(null, true);
});

const CREATE_NEW_VALUE = "__create_new__";
const PLACEHOLDER_VALUE = "__placeholder__";

let automation;
let draggingStepId = null;
let draggingActionId = null;
let draggingActionStepId = null;

const pageTitle = document.getElementById("page-title");
const stepList = document.getElementById("step-list");
const stepTemplate = document.getElementById("step-template");
const actionTemplate = document.getElementById("action-template");

function initEditor(id, isNewFlag) {
  if (isNewFlag) {
    automation = {
      id: null,
      name: "",
      createdAt: null,
      createdBy: null,
      lastRunAt: null,
      lastRunBy: null,
      steps: [newStepTemplate(1)],
    };
  } else {
    const found = id ? getAutomation(id) : null;
    if (!found) {
      showListView();
      return false;
    }
    automation = JSON.parse(JSON.stringify(found));
  }

  pageTitle.value = automation.name;
  renderSteps();
  return true;
}

function populateSelect(selectEl, options, selectedValue) {
  selectEl.innerHTML = "";
  options.forEach((opt) => {
    const optionEl = document.createElement("option");
    optionEl.value = opt.value;
    optionEl.textContent = opt.label;
    if (opt.value === selectedValue) optionEl.selected = true;
    selectEl.appendChild(optionEl);
  });
}

function populateRefSelect(action, selectEl) {
  const list = action.type === "directive" ? DIRECTIVES : PIPELINES;
  const typeLabel = action.type === "directive" ? "directive" : "pipeline";
  selectEl.innerHTML = "";

  if (!action.refName) {
    const placeholder = document.createElement("option");
    placeholder.value = PLACEHOLDER_VALUE;
    placeholder.textContent = `Select ${typeLabel}…`;
    placeholder.selected = true;
    selectEl.appendChild(placeholder);
  }

  list.forEach((name) => {
    const optionEl = document.createElement("option");
    optionEl.value = name;
    optionEl.textContent = name;
    if (name === action.refName) optionEl.selected = true;
    selectEl.appendChild(optionEl);
  });

  const createOption = document.createElement("option");
  createOption.value = CREATE_NEW_VALUE;
  createOption.textContent = `+ Create new ${typeLabel}…`;
  selectEl.appendChild(createOption);
}

function setActionTypeFieldsVisibility(row, type) {
  row.querySelector(".action-row__ref-field").hidden = type === "notification";
  row.querySelector(".action-row__notification-field").hidden = type !== "notification";
}

function buildActionRow(step, action) {
  const frag = actionTemplate.content.cloneNode(true);
  const row = frag.querySelector(".action-row");
  const typeSelect = row.querySelector(".action-type-select");
  const refSelect = row.querySelector(".action-ref-select");
  const configureBtn = row.querySelector(".configure-notification-btn");
  const deleteBtn = row.querySelector(".delete-action-btn");

  typeSelect.value = action.type;
  if (action.type !== "notification") populateRefSelect(action, refSelect);
  setActionTypeFieldsVisibility(row, action.type);

  typeSelect.addEventListener("change", () => {
    action.type = typeSelect.value;
    action.refName = "";
    if (action.type !== "notification") populateRefSelect(action, refSelect);
    setActionTypeFieldsVisibility(row, action.type);
  });

  configureBtn.addEventListener("click", () => {
    document.getElementById("notification-config-dialog").showModal();
  });

  refSelect.addEventListener("change", () => {
    if (refSelect.value === CREATE_NEW_VALUE) {
      const typeLabel = action.type === "directive" ? "directive" : "pipeline";
      const name = window.prompt(`Name for the new ${typeLabel}:`);
      if (name && name.trim()) {
        const list = action.type === "directive" ? DIRECTIVES : PIPELINES;
        list.push(name.trim());
        action.refName = name.trim();
      }
      populateRefSelect(action, refSelect);
      return;
    }
    if (refSelect.value === PLACEHOLDER_VALUE) return;
    action.refName = refSelect.value;
  });

  deleteBtn.disabled = step.actions.length <= 1;
  deleteBtn.title = deleteBtn.disabled ? "At least one action is required" : "Remove action";
  deleteBtn.addEventListener("click", () => {
    step.actions = step.actions.filter((a) => a.id !== action.id);
    renderSteps();
  });

  // Drag reordering within this step's action list only. stopPropagation keeps
  // these events from bubbling into the parent step-card's own drag handlers.
  row.addEventListener("dragstart", (e) => {
    e.stopPropagation();
    draggingActionId = action.id;
    draggingActionStepId = step.id;
    row.classList.add("is-dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", action.id);
  });
  row.addEventListener("dragend", (e) => {
    e.stopPropagation();
    row.classList.remove("is-dragging");
    row.draggable = false;
    draggingActionId = null;
    draggingActionStepId = null;
    row.parentElement.querySelectorAll(".action-row").forEach((r) => r.classList.remove("is-drop-target"));
  });
  row.addEventListener("dragover", (e) => {
    if (!draggingActionId || draggingActionId === action.id || draggingActionStepId !== step.id) return;
    e.preventDefault();
    e.stopPropagation();
    row.classList.add("is-drop-target");
  });
  row.addEventListener("dragleave", (e) => {
    e.stopPropagation();
    row.classList.remove("is-drop-target");
  });
  row.addEventListener("drop", (e) => {
    e.preventDefault();
    e.stopPropagation();
    row.classList.remove("is-drop-target");
    if (!draggingActionId || draggingActionId === action.id || draggingActionStepId !== step.id) return;
    const fromIndex = step.actions.findIndex((a) => a.id === draggingActionId);
    const toIndex = step.actions.findIndex((a) => a.id === action.id);
    if (fromIndex === -1 || toIndex === -1) return;
    const [moved] = step.actions.splice(fromIndex, 1);
    step.actions.splice(toIndex, 0, moved);
    renderSteps();
  });

  return row;
}

function setTriggerFieldsVisibility(cardEl, type) {
  cardEl.querySelector(".trigger-event-fields").hidden = type !== "event";
  cardEl.querySelector(".trigger-schedule-fields").hidden = type !== "schedule";
}

function buildStepCard(step, index) {
  const frag = stepTemplate.content.cloneNode(true);
  const card = frag.querySelector(".step-card");
  const handle = card.querySelector(".step-card__drag-handle");
  const indexLabel = card.querySelector(".step-card__index");
  const nameField = card.querySelector(".step-name-input");
  const deleteStepBtn = card.querySelector(".delete-step-btn");
  const radios = card.querySelectorAll(".trigger-type-radio");
  const tableSelect = card.querySelector(".trigger-table-select");
  const eventSelect = card.querySelector(".trigger-event-select");
  const intervalValueInput = card.querySelector(".trigger-interval-value");
  const intervalUnitSelect = card.querySelector(".trigger-interval-unit");
  const actionList = card.querySelector(".action-list");
  const addActionBtn = card.querySelector(".add-action-btn");

  indexLabel.textContent = `Step ${index + 1}`;
  nameField.value = step.name;
  nameField.addEventListener("input", () => {
    step.name = nameField.value;
  });

  // The third trigger option means something different depending on position:
  // manual invocation for the entry step, chaining off the prior step otherwise.
  // Both are always enabled — there's no invalid position for either meaning.
  const tertiaryRadio = card.querySelector(".trigger-type-radio--tertiary");
  const tertiaryLabel = card.querySelector(".trigger-type-tertiary-label");
  tertiaryRadio.value = index === 0 ? "manual" : "after_previous";
  tertiaryLabel.textContent = index === 0 ? "Manual invocation" : "After previous step";

  const radioGroupName = "trigger-type-" + step.id;
  radios.forEach((radio) => {
    radio.name = radioGroupName;
    radio.checked = radio.value === step.trigger.type;
    radio.addEventListener("change", () => {
      if (!radio.checked) return;
      step.trigger.type = radio.value;
      if (radio.value === "event" && !step.trigger.table) {
        step.trigger.table = TABLES[0];
        tableSelect.value = TABLES[0];
      }
      if (radio.value === "schedule" && !step.trigger.intervalUnit) {
        step.trigger.intervalUnit = "minutes";
        step.trigger.intervalValue = step.trigger.intervalValue || 1;
      }
      setTriggerFieldsVisibility(card, step.trigger.type);
    });
  });

  populateSelect(
    tableSelect,
    TABLES.map((t) => ({ value: t, label: t })),
    step.trigger.table
  );
  tableSelect.addEventListener("change", () => {
    step.trigger.table = tableSelect.value;
  });

  populateSelect(eventSelect, TABLE_EVENTS, step.trigger.event);
  eventSelect.addEventListener("change", () => {
    step.trigger.event = eventSelect.value;
  });

  intervalValueInput.value = step.trigger.intervalValue || 1;
  intervalValueInput.addEventListener("input", () => {
    step.trigger.intervalValue = Math.max(1, parseInt(intervalValueInput.value, 10) || 1);
  });

  populateSelect(intervalUnitSelect, SCHEDULE_UNITS, step.trigger.intervalUnit || "minutes");
  intervalUnitSelect.addEventListener("change", () => {
    step.trigger.intervalUnit = intervalUnitSelect.value;
  });

  setTriggerFieldsVisibility(card, step.trigger.type);

  step.actions.forEach((action) => {
    actionList.appendChild(buildActionRow(step, action));
  });

  addActionBtn.addEventListener("click", () => {
    step.actions.push(newActionTemplate());
    renderSteps();
  });

  deleteStepBtn.disabled = automation.steps.length <= 1;
  deleteStepBtn.title = deleteStepBtn.disabled ? "At least one step is required" : "Delete step";
  deleteStepBtn.addEventListener("click", () => {
    automation.steps = automation.steps.filter((s) => s.id !== step.id);
    renderSteps();
  });

  // Drag reordering: only the handle can start a native drag on the whole card
  // (mousedown/mouseup toggling `draggable` is delegated once, below).
  card.addEventListener("dragstart", (e) => {
    draggingStepId = step.id;
    card.classList.add("is-dragging");
    e.dataTransfer.effectAllowed = "move";
    e.dataTransfer.setData("text/plain", step.id);
  });
  card.addEventListener("dragend", () => {
    card.classList.remove("is-dragging");
    card.draggable = false;
    draggingStepId = null;
    stepList.querySelectorAll(".step-card").forEach((c) => c.classList.remove("is-drop-target"));
  });
  card.addEventListener("dragover", (e) => {
    if (!draggingStepId || draggingStepId === step.id) return;
    e.preventDefault();
    card.classList.add("is-drop-target");
  });
  card.addEventListener("dragleave", () => {
    card.classList.remove("is-drop-target");
  });
  card.addEventListener("drop", (e) => {
    e.preventDefault();
    card.classList.remove("is-drop-target");
    if (!draggingStepId || draggingStepId === step.id) return;
    const fromIndex = automation.steps.findIndex((s) => s.id === draggingStepId);
    const toIndex = automation.steps.findIndex((s) => s.id === step.id);
    if (fromIndex === -1 || toIndex === -1) return;
    const [moved] = automation.steps.splice(fromIndex, 1);
    automation.steps.splice(toIndex, 0, moved);
    renderSteps();
  });

  return card;
}

function renderSteps() {
  // The third trigger option's stored value tracks which position it's in —
  // "manual" only makes sense at index 0, "after_previous" everywhere else.
  // Reordering or deleting steps can move either into the wrong position, so
  // translate on every render instead of only guarding index 0.
  automation.steps.forEach((step, index) => {
    if (index === 0 && step.trigger.type === "after_previous") {
      step.trigger.type = "manual";
    } else if (index > 0 && step.trigger.type === "manual") {
      step.trigger.type = "after_previous";
    }
  });

  stepList.innerHTML = "";
  if (automation.steps.length === 0) {
    const empty = document.createElement("div");
    empty.className = "vds-card empty-steps";
    empty.innerHTML = `<p class="vds-b2" style="color: var(--vds-gray-400)">No steps yet.</p>`;
    stepList.appendChild(empty);
    return;
  }
  automation.steps.forEach((step, index) => {
    stepList.appendChild(buildStepCard(step, index));
  });
}

// Delegated once: only a drag started from a handle can move its card/row.
stepList.addEventListener("mousedown", (e) => {
  const stepHandle = e.target.closest(".step-card__drag-handle");
  if (stepHandle) {
    stepHandle.closest(".step-card").draggable = true;
    return;
  }
  const actionHandle = e.target.closest(".action-row__drag-handle");
  if (actionHandle) {
    actionHandle.closest(".action-row").draggable = true;
  }
});
document.addEventListener("mouseup", () => {
  stepList.querySelectorAll('.step-card[draggable="true"]').forEach((c) => {
    c.draggable = false;
  });
  stepList.querySelectorAll('.action-row[draggable="true"]').forEach((r) => {
    r.draggable = false;
  });
});

pageTitle.addEventListener("input", () => {
  automation.name = pageTitle.value;

document.getElementById("add-step-btn").addEventListener("click", () => {
  automation.steps.push(newStepTemplate(automation.steps.length + 1));
  renderSteps();
});

document.getElementById("save-btn").addEventListener("click", () => {
  const today = new Date().toISOString().slice(0, 10);
  if (!automation.id) {
    automation.id = "auto_" + Date.now();
    automation.createdAt = today;
    automation.createdBy = "Jeff Kroll";
  }
  if (!automation.name.trim()) {
    automation.name = "Untitled automation";
  }
  upsertAutomation(automation);
  showListView();
});

// ---------------------------------------------------------------------------
// Boot
// ---------------------------------------------------------------------------

showListView();
</script>
